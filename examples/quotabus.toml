# quotabus.toml — the fleet's API services and subscription accounts (docs/DESIGN.md §3, §4; EXP-001, EXP-002).
# `[service.context]` (EXP-003) gives each model's context window to the selector. No window below has been measured
# or confirmed against its provider, so none is set: a model without one sorts last under `--prefer largest-context`.
# `secret` is the NAME of an environment variable; the value is injected by the launcher
# (`doppler run -- quotabus probe` / `secretspec run -- quotabus probe`) and never written here.
# Model ids marked [unverified] were not confirmed against the provider when this file was written.

[bus]                                   # omit the whole table to use the file backend (§8)
url    = "nats://192.168.8.110:4222"    # Mini
bucket = "ai_status"

[intervals]                             # each query kind on its own schedule (DESIGN §3, SIG-004)
api     = "12h"                         # messages / chat-completions probe: twice a day
balance = "12h"                         # balance GET: twice a day
subscription = "1h"                     # subscription account reads: hourly (EXP-002)

# [ttl]                                 # a kind left out is 3 × its own interval (3 missed runs = UNKNOWN)
# api          = "36h"
# balance      = "36h"
# subscription = "3h"

[probe]
max_tokens = 20
# A row that would read ok reads degraded when any window (headroom.windows[].used_pct, or window_pct) is >= this %.
# A number, 0 < warn_pct <= 100; default 90 (CHORE-010: decided by an agent session's steer pass, bucket 2,
# 2026-10-08, open to the Captain's veto). Such a row carries reason "window_near_limit"; whether it files an alert is
# `[alert] states` below (SIG-010, ruled).
warn_pct = 90

