# The Sparks are observe-only here (`probe = false`, CHORE-023): this config is the user agent's, and macOS Local
# Network privacy blocks a user agent or user daemon from reaching them (HAZ-005, measured on Mini 2026-10-10). A ROOT
# LaunchDaemon probes them with its own key-free config (packaging/README.md); this process only reads their rows, so
# `status`, `select` and `alert` still list them. Only local services are observe-only; every keyed service is probed.
[[service]]
id         = "local-qwen"               # DGX1; unreachable from M5, so from there it reads cannot_assess:unreachable
probe      = false                      # probed by the root daemon (packaging/README.md), never by this process
kind       = "local"
provider   = "qwen"
family     = "qwen"
account    = "dgx1"
base_url   = "http://192.168.8.180:30000/v1"
protocol   = "openai"
models     = ["qwen3"]                  # [unverified]
roles      = ["work"]
cost_class = "local"
secret     = "NUSY_LOCAL_QWEN"

# ── Subscription accounts, read centrally by `quotabus probe` on this host (DESIGN §4, EXP-002). ──
# Nothing runs on any other host: each account's token is injected by the launcher like any API key.
# Undocumented sources are OFF here (SIG-003): uncomment them to opt in; every row they write is labelled
# `probe.source = "undocumented"`. The fleet's own config turns them on.

[[service]]
id         = "claude-hankh95"           # one [[service]] per Claude account; the row key ends in this id
kind       = "subscription"
provider   = "anthropic"
family     = "anthropic"
account    = "hankh95"                  # the account LABEL (a slug), never an email
base_url   = "https://api.anthropic.com"
models     = ["claude-haiku-4-5"]       # the model of the 1-token read
secret     = "NUSY_CLAUDE_TOKEN_HANKH95"   # a setup-token (`claude setup-token`)
sources    = ["stream_json"]            # `claude -p --output-format stream-json`: Claude Code's own output (official)
# sources  = ["unified_headers", "stream_json"]   # undocumented direct read first, stream-json when its headers are missing

[[service]]
id         = "copilot"
kind       = "subscription"
provider   = "github"
family     = "openai"
account    = "hankh95"
base_url   = "https://api.github.com"
secret     = "GITHUB_TOKEN"
sources    = []                         # off: the only source is undocumented
# sources  = ["copilot_internal"]       # GET /copilot_internal/user (undocumented)

# ── Alerts: `quotabus alert`, run after each probe cycle (DESIGN §3 alert, §10 Q8; EXP-004). ──
# One item per crossing (a service going bad), never auto-closed; the last alerted state is kept at `alert.<key>` in
# the same bucket, and only a measured `ok` re-arms it. stdout is always a sink. A sink left out is not used.
# `command` is run as given (use an absolute path under launchd/systemd, whose PATH is minimal); yurtle-kanban files
# on the board of the directory it runs in, so run `quotabus alert` from that repo, or point `command` at a wrapper.

[alert]
# The states a crossing files for (CHORE-018; Captain 2026-10-09: "SIG-010: go with the recommended default, option 3").
# Valid: quota_exhausted, auth_failed, model_missing, rate_limited, degraded, unreachable, window_near_limit. A list
# here replaces the default (this one): the hard failures plus a near-limit window. Latency-degraded and rate_limited
# stay on the bus (select refuses them) but file nothing; an unlisted state does not arm, and only a measured ok re-arms.
states = ["quota_exhausted", "auth_failed", "model_missing", "unreachable", "window_near_limit"]

[alert.nusy-kanban]
command   = "nusy-kanban"               # the sink gets PATH, HOME, TMPDIR, USER, LANG, TERM only: to name a
                                        # server, point this at a wrapper (`exec nusy-kanban --server … "$@"`)
item_type = "signal"                    # SIG-006: "Signal per crossing"
tags      = ["provider-status", "infra"]

[alert.yurtle-kanban]
command   = "yurtle-kanban"             # `create signal "<title>" --push --body-file -`
item_type = "signal"
tags      = ["provider-status"]

# [alert.webhook]                       # a JSON POST per crossing; the URL is never printed (it may be a credential)
# url = "https://example.invalid/hook"
